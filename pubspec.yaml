name: SportTracker
description: "l'application de sport la plus complête."
publish_to: 'none'
version: 1.0.3

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  fl_chart: ^0.68.0
  pedometer: ^4.0.0
  flutter_foreground_task: ^9.2.0
  permission_handler: ^11.0.0
  shared_preferences: ^2.2.2
  google_sign_in: ^6.1.4
  easy_localization: ^3.0.5
  cloud_functions: ^5.5.2
  firebase_core: ^3.14.0
  firebase_auth: ^5.6.0
  cloud_firestore: ^5.6.9
  table_calendar: ^3.0.9
  provider: ^6.1.1
  geolocator: ^13.0.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

dev_dependencies:
  flutter_launcher_icons: ^0.14.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/langs/fr.json
    - assets/langs/en.json
    - assets/langs/es.json
